<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Snake</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
        <link rel="stylesheet" href="/styles.css?v=snake" />
        <script src="/themes.js?v=502a9ab"></script>
        <link rel="icon" type="image/ico" href="/assets/terminal.ico" />
    </head>
    <body>
        <main class="page-container">
            <nav>
                <a href="/index.html" class="back-link">&larr; Back to Terminal</a>
            </nav>
            <h1>Snake</h1>
            <div class="game-container snake-game-container">
                <canvas id="snake" width="480" height="480" aria-label="Snake game board"></canvas>
                <div class="game-info snake-game-info">
                    <div class="snake-buttons">
                        <button id="startGame" type="button">Start</button>
                        <button id="pauseGame" type="button">Pause</button>
                        <button id="resetGame" type="button">Reset</button>
                    </div>
                    <div class="leaderboard">
                        <h3>Leaderboard</h3>
                        <ol id="leaderboard-list"></ol>
                    </div>
                    <h3>Score: <span id="score">0</span></h3>
                    <h3>Best: <span id="bestScore">0</span></h3>
                    <h4 id="status" class="snake-status">Ready</h4>
                    <div class="snake-settings">
                        <label>
                            Board
                            <select id="boardSize">
                                <option value="8">8 x 8</option>
                                <option value="20" selected>20 x 20</option>
                                <option value="50">50 x 50</option>
                                <option value="100">100 x 100</option>
                            </select>
                        </label>
                        <label>
                            Speed
                            <select id="speed">
                                <option value="6">6 tiles/sec</option>
                                <option value="9" selected>9 tiles/sec</option>
                                <option value="12">12 tiles/sec</option>
                                <option value="16">16 tiles/sec</option>
                            </select>
                        </label>
                        <label>
                            Edge
                            <select id="edgeMode">
                                <option value="wrap" selected>Wrap</option>
                                <option value="random">Random wall</option>
                                <option value="walls">Walls</option>
                            </select>
                        </label>
                    </div>
                </div>
            </div>
        </main>

        <div id="nameModal" class="modal">
            <div class="modal-content">
                <h2>Game Over!</h2>
                <p>Your score: <span id="finalScore">0</span></p>
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="30" />
                <button id="submitScore" type="button">Submit Score</button>
            </div>
        </div>

        <script src="/snake.js?v=snake"></script>
    </body>
</html>
